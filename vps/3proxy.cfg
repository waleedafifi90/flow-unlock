# 3proxy config for Flow Unlock — a single-user authenticated HTTP/CONNECT proxy.
# setup.sh fills __USER__ / __PASS__ / __PORT__ from the environment; do not put
# real credentials in this template (it is committed to the repo).

# DNS resolvers used by the proxy.
nserver 1.1.1.1
nserver 8.8.8.8
nscache 65536

timeouts 1 5 30 60 180 1800 15 60

# One account. CL = the password is stored in cleartext in this file (chmod 600).
users __USER__:CL:__PASS__

# Require that account for every connection; reject everyone else.
auth strong
allow __USER__

# --- Capacity guards ----------------------------------------------------------
# Cap total simultaneous connections so a traffic spike can't exhaust the box. A
# browser opens several connections per site, so ~3000 comfortably covers a few
# dozen active users. Lower it to be stricter; raise it only if you hit the cap.
maxconn 3000

# Ceiling on total download bandwidth through the proxy, in BITS per second, set
# below your link so the OS always keeps headroom and never fully saturates the
# 1 Gbit line (900 Mbit here). This is ONE shared bucket for everyone on this
# account — a safety ceiling for the whole box, NOT a per-person quota. For true
# per-person limits, give each person their own account (see README).
bandlimin 900000000 __USER__

# HTTP proxy (also tunnels HTTPS via CONNECT). -a hides the client IP from targets.
proxy -a -p__PORT__
